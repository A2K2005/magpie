<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Magpie Capture</title><link rel="stylesheet" href="popup.css"></head>
<body><main><h1>Save this view</h1><p>Capture the visible page to Downloads / Magpie Capture. Add that folder in Magpie to make captures searchable.</p>
